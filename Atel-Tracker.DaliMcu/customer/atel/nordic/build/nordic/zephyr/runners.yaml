# Available runners configured by board.cmake.
runners:
- nrfutil
- jlink

# Default flash runner if --runner is not given.
flash-runner: nrfutil

# Default debug runner if --runner is not given.
debug-runner: jlink

# Common runner configuration values.
config:
  board_dir: F:/myGithub/my-workspace/zephyr/boards/nordic/nrf54l15dk
  # Build outputs:
  elf_file: zephyr.elf
  hex_file: F:/myGithub/my-workspace/ncsSDK_demo/Atel-Tracker.DaliMcu/customer/atel/nordic/build/merged.hex
  bin_file: zephyr.bin
  # Host tools:
  gdb: F:/back_git/mcu_git/Atel-Tracker.DaliMcu/sdks/NCS/toolchains/66cdf9b75e/opt/zephyr-sdk/arm-zephyr-eabi/bin/arm-zephyr-eabi-gdb.exe

# Runner specific arguments
args:
  nrfutil:
    []

  jlink:
    - --dt-flash=y
    - --device=nRF54L15_M33
    - --speed=4000
